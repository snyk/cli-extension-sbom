version: 2.1

orbs:
  go: circleci/go@4
  prodsec: snyk/prodsec-orb@1

jobs:
  unit-test:
    executor:
      name: go/default
      tag: '1.26.5'
    steps:
      - checkout
      - go/load-mod-cache
      - go/mod-download
      - go/save-mod-cache
      - go/test:
          covermode: atomic
          failfast: true
          race: true
  lint:
    docker:
      - image: golangci/golangci-lint:v2.9.0-alpine
    steps:
      - checkout
      - run: golangci-lint run -v ./...

  security-scans:
    executor:
      name: go/default
      tag: '1.26.5'
    resource_class: small
    steps:
      - checkout
      - go/load-mod-cache
      - go/mod-download
      - go/save-mod-cache
      - prodsec/security_scans:
          mode: auto
          iac-scan: disabled

workflows:
  version: 2
  CI:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: snyk-vuln-alerts-sca-scanners
          filters:
            branches:
              ignore:
                - main
      - security-scans:
          name: Security Scans
          context:
            - engines_sca-scanners
            - prodsec-orb-runtime
      - unit-test:
          name: Unit Test
      - lint:
          name: Linting

